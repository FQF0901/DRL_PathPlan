# 出处：GPT R38 §八 schema（symbol/file/category/production·training·evaluation·test refs/checkpoint_keys/
#       replacement/removal_commit）；判定依据 = docs/code_reachability_audit.md（四判据 × 8 组候选）。
# 机器基线：.slim/deepwork/p1_v2/round38/{c5_reach_scan.json, c5_ckpt_keys.json, c5_ckpt_families.json}
#
# 引用格式：prod/train/eval/test 四列 = "行命中/去重文件数"（口径见审计 §1.1）；
#           slim/runs 面列在 notes（不计入可达性判定，但决定迁移同步面）。
#
# 纪律（写入每笔提交的验收）：
#   1. 三笔独立提交：迁移 → 删引用 → 删实现（每笔可回退）；removal_commit 实施时回填（当前一律 null）。
#   2. 每笔必过 pytest 全量（2026-10-15 collect 973 项） + 默认关逐位（默认关路径键集/前向逐位不变）。
#   3. oneshot / plan_override / 旧 set_ego_warp / K-anchor / path_* 的删除必须同步 .slim 评估链与
#      L-A 契约断言（§5.69-③）；legacy set_ego_warp 删除前必须**先冻结逐位 oracle fixture**（§5.69-①）。
#   4. KEEP 项（21 个）不入本清单；清单 = 46 项（ARCHITECTURE_FORBIDDEN 19 / LEGACY_REPRO 24 /
#      CHECKPOINT_ONLY 3）。

