# 环境配置：MetaDrive 仿真、步长、观测与场景生成
sim:
  backend: metadrive               # 仿真后端
  package: metadrive-simulator     # 依赖包名
  version: "0.4.3"                 # 固定版本
  numpy: "<2"                      # 版本约束（MetaDrive 0.4.3 需要 numpy<2）
  headless: true                   # 无渲染窗口
  physics_only: true               # 仅物理，不启用渲染特性
  workers: 8                       # P0 冻结：8×0.65GB ≈ 5.2GB，留 3–4GB 给 trainer
  store_map: false                 # P0 冻结：重建仅 0.2–0.6s/张，泄漏 +11MB/1000 resets
  traffic_lights: false            # 不使用信号灯：观测恒为“无灯”
  multi_agent: false               # 不启用多智能体（暂缓）

timing:
  policy_dt: 0.5                   # 策略步长（秒）= 2 Hz
  mpc_dt: 0.1                      # MPC/插值参考步长（秒）= 10 Hz
  preview_points: 6                # 参考轨迹预览点数
  preview_horizon: 3.0             # 预览时长（秒）：6 × 0.5 s

obs:
  history_frames: 6                # 历史帧数（每帧 0.5 s）
  alignment: current_ego_se2       # 历史帧对齐到当前 ego 的 SE(2) 坐标系
  topk_objects: 16                 # OD：top-16 动态对象
  topk_lanes: 16                   # LD：top-16 车道特征
  navigation: true                 # 导航输入：get_checkpoints() + navigation_command
  distance_to_turn: false          # 不计算到转弯距离
  signal_placeholder: true         # 信号占位通道（恒为“无灯”）
  speed_limit: true                # 观测当前限速
  ego_dynamics: true               # 观测 ego 动力学状态

scenario:
  sequence: BIG_BLOCK_SEQUENCE     # 由显式 BIG_BLOCK_SEQUENCE 组装地图
  blocks:                          # 可用 block 类型
    - straight                     # 直道
    - curve                        # 弯道
    - ramp                         # 匝道
    - fork                         # 分岔
    - merge                        # 汇入
    - split                        # 分流
    - intersection                 # 交叉口
    - uturn                        # 掉头
    - roundabout                   # 环岛
    - bottleneck                   # 瓶颈
    - tollgate                     # 收费站
    - bidirection                  # 双向路段
  blocks_per_map: [3, 5]           # 小地图规模：3–5 个 block
  cache:
    type: lru                      # 地图缓存：有界 LRU
    max_entries: 32                # P0 实测重建 0.2–0.6s/张 → 默认不依赖缓存；仅可选小 LRU（3.1MB/张）
  set_speed_limit_after_build: true  # 构建后再写入限速
  behaviors: [cut_in, cut_out]     # 脚本化 cut-in / cut-out
  spec_dir: env/specs              # 生成的 spec 落盘目录
