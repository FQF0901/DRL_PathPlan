# Bank-native network configuration.
# This file is consumed by net/build_net.py.  The bank/rollout sections are
# runtime configuration; they do not create nn.Module singletons.
model:
  hidden: 128
  action_dim: 4
  history_frames: 6
  attention_heads: 4
  spatial_layers: 2

  encoder:
    hidden: 128

  temporal_spatial:
    hidden: 128
    heads: 4
    spatial_layers: 2

  world_model:
    hidden: 128
    action_dim: 4
    ld_points: 5

  planner:
    hidden: 128
    action_dim: 4

bank:
  capacity: 6
  od_slots: 16
  ld_slots: 16

rollout:
  horizon: 6

ego:
  dt: 0.5
  wheelbase: 2.46894
  max_steer_rad: 0.6981317007977318

action:
  bounds:
    name: clean
    low: [0.0, -1.5, -0.8, 0.0]
    high: [7.5, 1.5, 0.8, 15.0]
  limits:
    hard:
      a_long_min: -10.0
      a_long_max: 3.5
      a_lat_max: 8.0
      kappa_max: 0.345
      kappa_rate_max: 1.0
      jerk_long_max: 20.0
      jerk_lat_max: 20.0
    comfort:
      a_long_min: -4.0
      a_long_max: 2.0
      a_lat_max: 3.0
      kappa_max: 0.20
      kappa_rate_max: 0.05
      jerk_long_max: 5.0
      jerk_lat_max: 5.0

deployable_param_target: 1300000
deployable_param_min: 800000
deployable_param_max: 1500000
