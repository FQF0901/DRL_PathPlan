# 分阶段训练（v1.3/lane U1）：A = WM 教师强制（+ plan head ego_next 监督）；
# B = planner BC（phase 1 primary：MoE 关闭 → 冻结 → phase 2 specific：MoE 开 + worst/mild 权重
# + Switch 式负载均衡 aux；无聚类监督）；C = PPO RL（EXPERIMENTAL）
runtime:
  python: "3.10"                  # 运行 Python 版本
  seed: null                      # 全局种子（P1 固定）

train:                            # 运行设备 / 线程 / batch（2026-09-26 GPU 化；CLI 显式参数优先）
  device: auto                    # auto = CUDA 可用则 cuda，否则 cpu（显式 "cpu" 行为不变）
  threads:
    max_per_process: 8            # 每进程 torch 线程上限：min(cap, cpu_count // workers)（≤8）
    omp_num_threads: 1            # OMP/MKL 默认值（setdefault）；数据集型训练由 tools/train.sh 默认 8，
                                  # 此处的 1 保护 eval 多 worker spawn（避免每 worker 8 OMP 线程风暴）
  ppo:
    minibatch_size: 1024          # PPO 更新 minibatch（cheap path，GPU；与 --batch-size 独立）
    target_kl: null               # v4 ② KL 守门（CLI --target-kl）：某 minibatch approx_kl > 该值时
                                  # 跳过该 epoch 剩余 minibatch（并终止本 update 后续 epoch），
                                  # 记 train/kl_early_stop；null（默认）= 不守门（旧行为：跑满）
    group_probe_every: 1          # v4 ③ 分参数组梯度/更新范数探针间隔（CLI --group-probe-every）：
                                  # 每 N 个 update 记录 policy/value/experts/other 的 pre-clip 梯度范数
                                  # 与实际更新范数（纯监控，不进优化器；0=关）
    anchor_grad_probe: true       # v4 ④ KL 锚梯度探针（CLI --anchor-grad-probe/--no-…）：
                                  # kl_anchor_coef>0 时独立重算锚 loss（与主损失同口径；v4 ⑨ 后
                                  # mu/raw logstd 均有梯度——旧版 mu 路径 detach 的历史行为已修复）
                                  # 并记录 anchor_grad_norm/{policy,value,experts,other,mu,logstd}
                                  # —— 只读、不进优化器（判定锚是否真作用于参数）
    anchor_grad_probe_size: 128   # ④ 探针子批行数（只影响探针开销/统计口径，不影响训练数值）
  wm:
    batch_size: &stage_a_batch 1024   # Stage A 宏 batch（物化快路径 + 梯度累积；CLI --batch-size 覆盖）
    micro_batch_size: &stage_a_micro 256  # ST-GNN 6 步展开实测 ~32MB/样本：12GB 卡 micro 上限 256（384 OOM）
  bc:
    batch_size: &stage_b_batch 1024   # 宏 batch（物化快路径 + 梯度累积；CLI --batch-size 覆盖）
    micro_batch_size: &stage_b_micro 512  # rollout micro 512；2026-09-28 实测当前阶段 B 图峰值 ~3.7GB（去聚类+关 WM 前为 6.6GB；768/1024 未再标定）
  probe_batch: datasets/BTC20260926-2343_expert5k  # 固定探针批（动作 ds/logstd 漂移 + 低速吸引子；
                                  # null=关闭；路径缺失时显式告警并关闭探针）
  critic_warmup_updates: 0        # 阶段 C 前 N 个 update 只拟合 critic（value 头；策略/主干冻结；CLI --critic-warmup-updates）
  adv_norm: global                # 阶段 C 优势归一化口径（CLI --adv-norm）：global=全批零均值/单位方差（旧行为）；
                                  # per_scenario=按帧级 spec.id 分组各自归一化；none=不归一化
                                  # 2026-09-30 G3：global 同时修复 padding 行污染（compute_gae valid_mask）
  value_lr_scale: 1.0             # v4 ①：阶段 C value 头 LR 缩放（CLI --value-lr-scale）——
                                  # value.* 组 lr = lr × scale；1.0（默认）= 不单独建组 = 现状/旧分组逐位一致
  trim_memory_every: 4            # V11/P2：阶段 C trim_memory 降频（1=每个 update；0=仅收尾一次）；
                                  # 只影响 RSS 回落节奏，不改变训练数值（旧版恒 72 ms/update）
  ckpt_every: &ckpt_every 5       # A/B 每 N 个 epoch 周期保存 <stage_out>/ckpt_epoch{N:03d}.pt（0=关；
                                  # 与 final.pt 同格式/payload：model/optimizer/epoch/val/RNG/配置哈希）。
                                  # CLI --ckpt-every 优先；被静默杀掉后用 --resume <ckpt> 从 epoch+1 续跑

data:
  spec: env/specs/scenarios_train.json  # 训练场景 spec
  steps_per_epoch: 100000         # 每 epoch 环境步数（评估每 5 epoch，见 eval.yaml）
  buffer:
    type: replay                  # 回放缓冲区
    capacity: null                # 容量 P1 标定

# 入口脚本运行开关（tools/train.sh / tools/test.sh → tools/run_config.py 读此节；auto 语义见 pipeline/run_paths.py）
run:
  name: train                     # run 名：work_dir = runs/BTC<北京戳>_<name>（同轮 A/B 共用一个 run 根）
  work_dir: auto                  # auto = runs/BTC<北京戳>_<name>；阶段目录 <run>/stage_{a,b} 由 stages.py 写
  bc_dir: auto                    # 专家数据集：auto = 最新 datasets/BTC*_expert*（含 expert_bc.npz）
  resume: auto                    # auto = 最新「有周期 ckpt、无 final.pt」的 stage 原地续跑；空 = 全新；或显式 ckpt
  stage_a_ckpt: auto              # Stage B 初始化：auto = 最新 <run>/stage_a/final.pt；B 复用该 run 根
  eval_ckpt: auto                 # 评测权重（tools/test.sh）：auto = 最新 stage_b/final.pt，回退 stage_a final
  checkpoint_interval_epochs: *ckpt_every  # 周期 ckpt 间隔（--ckpt-every；与 train.ckpt_every 同源）

stages:
  A:
    name: world_model_teacher_forcing  # 阶段名
    epochs: &stage_a_epochs 20    # Stage A 轮数（脚本 --wm-epochs；world_model.epochs 与其同源）
    batch: *stage_a_batch         # 宏 batch（脚本 --batch-size；train.wm.batch_size 同源）
    micro: *stage_a_micro         # micro batch（脚本 --micro-batch-size；train.wm.micro_batch_size 同源）
    world_model:
      epochs: *stage_a_epochs     # WM 轮数（CLI --wm-epochs 优先）
      ego_condition: expert_gt_actions  # ego 条件 = 专家 GT (ds,dθ) 序列（6×2）
      targets: future_od_ld_lookup      # 目标 = (episode, step+5k) 查表 + 对齐 t0 + mask/valid
      slot_matching: nearest_neighbor_t0 # OD 槽位按 t0 帧最近邻匹配（gate 8m；--no-match-future-slots 关闭）
      loss: direct_multi_step           # Huber + 角度 1-cos
      noise: ego_plan                   # ego plan 噪声增强（CLI --plan-noise*）
      ego_next_coef: 0.1        # plan head `ego_next` 监督权重（方案①：A 阶段 plan head/MoE 唯一梯度源）
      ld_coef: 0.0              # 未来 LD 直接多步权重（2026-09-30 用户拍板：0.02→0.0。闭环证据：ld=0 链
                                # L2→基座 0.328→E-β′ 0.436 优于 ld=0.02 链（phase2 0.222）；A 不再监督 LD 头
                                # （LD 损失仅监控，可经 --wm-ld-coef 开启）。目标 = ld_fut 前 4 维，ld_mask/wm_valid 掩码）
      presence_coef: 0.1        # presence BCE 权重（id 轴：未来帧同 track id 是否仍在盒内）
      entry_coef: 0.1           # entry BCE 权重（id 轴：新 id 是否出现，"t0 无、t+k 有"）
      trainable: [encoders, mem_encoder, plan_head, st_gnn]  # lane U1+：MoE 在 A 关闭（experts+gate 只在 B-phase2 训）；policy/value 头不参与
  B:
    name: planner_bc            # 阶段名（lane U1：phase 1 MoE 关闭 → 冻结 → phase 2 权重化 specific）
    epochs: &stage_b_epochs 20  # Stage B 总轮数（脚本 --bc-epochs；bc.epochs 与其同源）
    batch: *stage_b_batch       # 宏 batch（脚本 --batch-size；train.bc.batch_size 同源）
    micro: *stage_b_micro       # micro batch（脚本 --micro-batch-size；train.bc.micro_batch_size 同源）
    traj_aux_weight: &stage_b_traj_aux 0.1  # 轨迹辅助权重（脚本 --traj-aux-weight；bc.traj_aux_weight 同源）
    phase3:                     # lane P3-B：迭代恢复训练（每轮独立；数据 = 当轮 DAgger 失败窗口目录）
      rounds: 5                 # 迭代轮数（编排 lane：采集 → 训练 → 闭环评测；harness 用）
      spec_pool: env/specs/scenarios_train_5k.json  # 采集池（5k 覆盖整池；lane P3-A 产物）
      fail_target: 1000         # 每轮目标失败窗口数（采集侧语义；编排 lane 用）
      shuffle_seed_base: 20260928  # 轮内数据 shuffle 种子 = base + round（跨轮顺序不相关）
      collect:                  # 采集侧（编排 lane：tools/dagger_collect.py）
        workers: 16             # spawn worker 数（实测 16 workers ≈ 0.85 s/spec）
        window_s: 10            # 失败窗口 = 终止前 N 秒（--window-fail-before）
      init_ckpt: runs/BTC20260929-0425_fixA_nold/stage_b/final.pt  # 起点权重（CLI --ckpt 优先；2026-09-29 切至 L2 链 B final = 新代码代最优闭环 0.328 作 phase3 基座）；注意 auto 解析器 glob 尚不适配 _train 命名（待修）
      epochs: 5                 # 每轮 epoch 数（CLI --phase3-epochs）
      batch: *stage_b_batch     # 宏 batch（CLI --batch-size；缺省复用阶段 B 锚点）
      micro: 256                # micro batch：phase3 混合路径（rollout + WM 教师强制 + 多损失）实测
                                # micro 512 OOM（11.6 GiB 卡）→ 取 stage A 标定上限 256（384 已 OOM）；
                                # 仍 OOM 由链的 OOM 自愈再减半重试（256→128→64，下限 64）
      lr_scale:                 # LR 分组缩放（全参数解冻；CLI --phase3-lr-{base,specific}-scale）
        base: 0.25              # encoders/mem_encoder/plan_head/st_gnn/WM/policy/value
        specific: 0.5           # experts/gate(router)/residual_scale
      losses:                   # 损失权重（CLI --phase3-*-weight / --load-balance-coef）
        action: 1.0             # ① 首步动作（action_mu vs 专家即时动作）
        action_chain: 0.2       # ①b 多步动作链（rollout plan 第 2..6 步 vs 未来专家首步标签）
        ego_next: 0.1           # ② plan head ego_next（未来 ego 特征；wm_valid 尾部 mask）
        od: 0.005               # ③ WM OD 直接多步（Huber + angle，与阶段 A 同构；方案1 量级归一，防 WM 主宰）
        ld: 0.002               # ③ WM LD 恢复监督（目标 = ld_fut/ld_mask；方案1：ld 原始量级≈4×od，按比例再降）
        presence: 0.1           # ③ presence BCE（id 轴目标）
        entry: 0.1              # ③ entry BCE
        traj_aux: 0.0           # traj 仅监控不进损失（fail-window traj6 是常量外推合成值）
        load_balance: 0.01      # MoE Switch 式负载均衡 aux α（沿用阶段 B 口径）
      freeze: specific_only     # lane P3-I：冻结配方（CLI --phase3-freeze）——specific_only（新默认）=
                                # 只训 experts/router/residual_scale（复用 phase 2 冻结清单）；WM od/ld/presence/entry
                                # 与 ego_next 在冻结下无梯度 → 损失自动置 0（保留 action/action_chain/load_balance）；
                                # all = 全参数解冻（含 WM；旧行为，"无锚+全解冻"两次实证必崩 0.032/0.038）
      anchor:                   # lane P3-I：5k 锚（CLI --phase3-anchor*；默认关 = 仅当轮窗口 dagger 行）
        enabled: false          # 开启后 phase-3 训练集 = 窗口行（权 1.0）+ 锚行（权 ×mild_weight）
                                # 2026-09-29 试验启用（③ 验证中）；通过后转正、否则回退
                                # ③ 真循环结果（2026-09-29 20:45，BTC20260929-195151）：r1 即触发 base
                                # 护栏（基座 0.3260 → 0.2260，net −0.10；对照无锚 r1=0.232）→ 未通过，已回退
        bc_dir: auto            # auto = 最新 datasets/BTC*_expert*（同 run.bc_dir 语义）；目录缺失 → 报错
        mild_weight: 0.1        # 锚行权重 = train_weight×配平×mild_weight（窗口行权重不变）
        # P4b（R1/R4）接线口径：phase3_loop 读本块并透传 --phase3-anchor / --phase3-anchor-bc-dir /
        # --phase3-anchor-mild-weight；enabled=false（默认）时完全不传 → 行为与旧版一致（默认保持关）。
        # 强锚 mild_weight=1.0 为已确认"窗口×强锚"交互增益候选（E-β′ 0.436）；真循环验证在独立 lane。
        # 混教师提醒：强锚数据=idm、窗口标签=pure_pursuit（勿误读为已对齐）。
      gpu:                      # lane P3-E：GPU 子步骤前显存守卫
        min_free_mib: 6144      # 空闲显存下限（低于 → 释放+等待重试 ≤3 次；仍不足 failed）
      eval:                     # 编排 lane：每轮闭环评测
        spec: env/specs/scenarios_eval500.json
        workers: 6              # 2026-09-29：16→6（本机 12GB 卡实测 6 workers ≈ 9.5GB；16 会 OOM）
      guard:                    # 编排 lane：早停守卫（相对 phase2 基线的 success 绝对下降阈值）
        stop_on_overall_drop: 0.05
        stop_on_easy_drop: 0.10
        # ---- P4b（R1/R4）新增：口径澄清（旧注释上方的两个键仅在 mode=prev 生效）----
        mode: base              # 默认 base = 与循环入口基座自评比较（base_eval：对 init_ckpt 用同一
                                # spec/limit/workers 评一次；不可得 = 硬错 fail-closed）；r1 起即判定。
                                # prev = 旧口径（仅与上一轮比较；stop_on_overall_drop/stop_on_easy_drop
                                # 只在此模式生效）。off = 不判定（状态 guard_off=true + 日志显著标注）。
        stop_on_base_drop: 0.01 # base 模式：net_vs_base = 本轮 overall_success − 基座；下降超过该值 →
                                # stopped_guard（记录原因）。评测确定性（deterministic=True，动作=action_mu，
                                # 无评测噪声）→ 阈值=实质显著性（0.01 = 1pt）。
                                # 张力提示：无锚配方下 r1 可能即低于基座而触发（护栏正确工作，非 bug；
                                # 见 docs/phase3_rootcause_analysis.md §8.1 注 / §10.5）。
    bc:
      epochs: *stage_b_epochs   # 总轮数（CLI --bc-epochs 优先）
      primary_phase_split: 0.5  # primary 段占比（其余为 specific 段）
      action_weight: 1.0        # 主损失：action_mu vs 专家即时动作
      traj_aux_weight: *stage_b_traj_aux  # 辅助：rollout traj_xy vs 专家 traj6（WM 冻结 + detach）
      load_balance_coef: 0.01   # lane U1：MoE 负载均衡 aux α（Switch 式 α·E·Σ f_i·P_i；phase 2）
      hard_weight: 1.0          # lane U1：worst-50%（冻结 primary IL 误差）行权重倍率
      mild_weight: 0.1          # lane U1：其余 50% 行权重倍率（有效质量 = 0.55；全量曝光）
      loss_type: l2
      wm_detach: true           # v2 固定语义：合成帧恒 detach；该键为 no-op（兼容保留）
  C:
    name: ppo_rl                # 阶段名
    tracker: mpc_lqr            # 环境内 MPC/LQR 跟踪器
    router_supervision: none    # lane U1：router 无监督（仅负载均衡 aux；去聚类）
    kl_anchor: true             # KL 锚 = 阶段 B 策略快照（--ckpt）
    kl_anchor_coef: 0.05        # 初始系数（CLI --kl-anchor-coef）
    kl_anchor_final_coef: 0.0   # 末值（线性衰减，CLI --kl-anchor-final-coef）
    wm_freeze_updates: null     # 【已弃用（W1）】st_gnn 现为全期冻结；该键仅保留兼容
    wm_loss_enabled: false      # W1 解冻守卫：WM 自监督损失（W2）未接线 ⇒ false；置 true 会 fail-fast
    plan_reference: repeat_action  # P0-1 A-hold：收集侧跟踪器参考口径（repeat_action = 6 步
                                   # repeat(a_t)，执行只依赖 PPO 记账变量；plan = 旧行为，仅供对照）
    trainable_scope: design     # R2/P0-6 冻结范围：design（默认）= allowlist（policy/value +
                                # plan_head.moe.experts/residual_scale 可训；encoders/primary/router/
                                # st_gnn 等全冻，"干净 PPO 基线"的设计口径）；all = 旧行为（仅冻 st_gnn）
    spec_rotation: episode      # S1/v3（2026-09-30）：LocalEnvPool 训练 spec 轮换口径（CLI --spec-rotation）。
                                # episode（默认，修正）= 每个 episode 终局 auto-reset 按 round-robin 轮换
                                # 下一条 spec（旧行为"整个 run 只训 spec[0]"是 v2 各臂的隐藏混杂）；
                                # off = 旧行为（auto-reset 复用当前 spec，仅显式 reset 轮换）
    policy_logstd_max: null     # S2/v3（2026-09-30 探索降噪）：策略分布 logstd 上界（CLI --policy-logstd-max）。
                                # null（默认）= 不钳制、行为逐位不变；给值（如 -1.5/-2.0）→ 采样与
                                # update logprob/entropy/KL 使用同一钳制后分布（init 采样近乎必崩的降噪手段）
    primary_lr_scale: 0.1       # 主专家学习率 ×0.1
    probe_interval: 25          # G4/v3（2026-09-30 漂移探针）：每 N 个 update（含 u1 基准）在
                                # train.probe_batch 固定探针批上做一次 rollout=True, world_model=False
                                # 前向，记 plan[:,1:6]/action_mu 相对首次记录的 RMS 位移（CLI
                                # --probe-interval；0=关）；纯监控（不进 loss/动作/buffer）
    ckpt_every: 25              # G3 最小下一步：每 N 个 update 保存 <out>/ckpt_u<NNN>.pt（CLI
                                # --ckpt-every；0=关；仅保存点，不引入 resume；final.pt 仍写）
    # reward:                   # P4 奖励钩子（透传 build_reward_adapter；缺省 = DEFAULT_TERM_CONFIGS）
    #   terms:                  #   项配置列表（name/weight/…）；单点覆盖可直接用 CLI
    #     - {name: speed_ratio, weight: 0.0}   #   --reward-term-weight speed_ratio=0.0（推荐，落 manifest）
    #     - {name: lane_center, weight: -0.1}  #   默认关的车道保持项（死区 0.25m/截断 3m）在此或 CLI 追加启用
    #   aggregation: {}         #   聚合配置（AggregationConfig 字段）

monitoring:
  tensorboard: true               # 输出 tensorboard
  csv: true                       # 同步输出 CSV
  scene_labels: true              # 逐步场景标签统计（场景分布 + MoE 分析）
  moe_routing: true               # MoE 路由统计（有效专家数 / 权重 / 输出范数 / token 数）
