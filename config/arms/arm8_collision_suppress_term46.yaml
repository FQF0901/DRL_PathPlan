# P4 arm8-A′（碰撞抑制候选 A 的条件升级档）— 碰撞终局罚上调至 −46
#   （相对 arm0 bundle 单变量：aggregation.terminal_values.collision −22 → −46，Δ=+24）。
# 用途：§7.5 条件升级——仅当 arm8-A（−32）主判据通过（clean500 net ≥ +20 且 z ≥ 1.96）
#   但辅助碰撞闸未过、且 A 的 clean500 碰撞率 ≤ 15.0%（相对 arm0 16.8% 有剂量响应）时执行；
#   否则不跑。
# 语义：collision 终局 = max_step 档终局值 −46 ⇒ 碰撞总罚 ≈ −45.4 vs 出界 −15.0 /
#   超时 −15.05，分离 30.4 = 当前 4.75×（失败类排序不变、间距拉大）。
# 加载：tools/train.py --stage C --config config/arms/arm8_collision_suppress_term46.yaml ...
# 单变量：碰撞终局值 collision −22 → −46（Δ=+24）。
# 注：includes 平铺合并语义（stages 段整体替换）见 config/arms/README.md「加载语义」。
includes:
  - config/default.yaml
  - config/env.yaml
  - config/model.yaml
  - config/train.yaml
  - config/eval.yaml
stages:
  C:
    reward:
      terms:
        - {name: route_completion, weight: 1, gamma: 1.0}
        - {name: speed_ratio, weight: 0.4, cap: 1.0}
        - {name: low_speed, weight: -0.2}
        - {name: comfort_lon, weight: -0.05, deadband: 2.5}
        - {name: comfort_lat, weight: -0.05, deadband: 2.0}
        - {name: comfort_jerk, weight: -0.005, deadband: 5.0}
        - {name: solid_line, weight: -2.0}
        - {name: speed_limit, weight: -5.0, tolerance: 0.05}
        - {name: crash, weight: -10.0}
        - {name: out_of_road, weight: -8.0}
      aggregation:
        terminal_values:
          arrive_dest: 29
          collision: -46
          out_of_road: -14
          max_step: -46
          error: -5
