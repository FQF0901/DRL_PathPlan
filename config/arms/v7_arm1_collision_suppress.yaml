# v7 P4-extra — arm1 配方 + 碰撞抑制单变量（起点 = arm1 s11 u150；v6 §7.5 arm8-A 口径）
# 用途：v7 预注册 §12（收尾后 P4-extra 定向尝试）：在程序最佳 RL 产物 arm1-s11 u150
#   （clean500 0.668 / eval500 0.646；collision 0.182/0.202 超 IDM 0.174/0.144）上，
#   以**单变量**碰撞抑制把 collision 压回安全闸（≤IDM）并保持 success ≥ s11 −3pp。
# 单变量（相对 config/arms/v7_arm1_offroad.yaml）：aggregation.terminal_values.collision
#   −22 → −32（Δ=+10；v6 §7.5 候选 A 设计）。其余项/终局值/KL 锚/λ 逐位同 arm1：
#   terms = rc 1 + speed_ratio 0.4 + low_speed −0.2 + comfort_* + solid_line −2 + speed_limit −5
#   + crash −10 + out_of_road −8 + off_road_edge −0.5(scale 1.0)；
#   终局值 arrive +29 / collision **−32** / out_of_road −14 / max_step −46 / error −5。
# 语义（v6 §7.5 A）：碰撞总罚（crash −10 + terminal −32 = −42）相对出界总罚
#   （out_of_road −8 + terminal −14 = −22）的分离由 10 → 20，压低低成功率"冒险救援"的
#   边际收益（v6 口径盈亏门槛 p* 9.0% → 20.2%）。
# 基线/池/课程/PPO pins 不动（v6 P4 arm0 口径）：spec=scenarios_train_dagger_r1.json(500) /
#   envs=1 / updates=100（短程）/ rollout=256 / max-episode-steps=200；起点 s11 u150 ckpt 由
#   driver 传 --ckpt（不入本文件）。
# KL 锚（方差控制；v7 预注册 §12）：初始 0.05 → 末值 0.02（线性慢衰减；锚参考 = 起点 s11）。
#   **执行路径注意**：Stage C 代码只读 CLI（--kl-anchor-coef/--kl-anchor-final-coef；
#   stages.C 段整体替换 → 非 reward 键不被本文件承载），driver 按本文件值传 CLI 并 fail-closed
#   断言（/tmp/opencode/v7_p4extra_driver.py）。本文件中的 kl_anchor_* 键为记录/预注册一致性用途。
# 加载：tools/train.py --stage C --config config/arms/v7_arm1_collision_suppress.yaml ...
# 注：includes 平铺合并语义（stages 段整体替换）见 config/arms/README.md「加载语义」。
# includes 说明：训练侧 pipeline.stages.load_config 只解析一层（不递归）——单写 config/default.yaml
# 只会带入其 project 元数据而丢失 train/data/run 等段（dry-run 实测）；故同时列出 default.yaml 的
# 四个叶子子配置，保证平铺合并结果 = 解析 config/default.yaml；递归加载器（eval_runner.load_config）
# 下两种写法等价。详见 config/arms/README.md「加载语义」。
includes:
  - config/default.yaml
  - config/env.yaml
  - config/model.yaml
  - config/train.yaml
  - config/eval.yaml
stages:
  C:
    reward:
      terms:
        - {name: route_completion, weight: 1, gamma: 1.0}
        - {name: speed_ratio, weight: 0.4, cap: 1.0}
        - {name: low_speed, weight: -0.2}
        - {name: comfort_lon, weight: -0.05, deadband: 2.5}
        - {name: comfort_lat, weight: -0.05, deadband: 2.0}
        - {name: comfort_jerk, weight: -0.005, deadband: 5.0}
        - {name: solid_line, weight: -2.0}
        - {name: speed_limit, weight: -5.0, tolerance: 0.05}
        - {name: crash, weight: -10.0}
        - {name: out_of_road, weight: -8.0}
        - {name: off_road_edge, weight: -0.5, edge_scale_m: 1.0}
      aggregation:
        terminal_values:
          arrive_dest: 29
          collision: -32
          out_of_road: -14
          max_step: -46
          error: -5
    # KL 锚（记录用；driver CLI 实际生效；见文件头「执行路径注意」）
    kl_anchor_coef: 0.05
    kl_anchor_final_coef: 0.02
