# Optional joint policy + WM fine-tune defaults.
# The r3 policy checkpoint contains an untrained WM module; replace it with a
# trained bank-native WM checkpoint before a real joint run.
data:
  - data/episodes/train_2000/il_expert_raw
val_data:
  - data/episodes/val_500/expert_raw
val_split: data/splits/val_500.json
ckpt: runs/bc_dagger_raw_r3_261101235342/best_closed_loop.pt
out: runs/joint_r3
epochs: 1
batch_size: 128
max_pairs: 60000
lr: 0.00002
tsb_lr: 0.000001
policy_weight: 1.0
wm_weight: 1.0
policy_tol: 0.05
content_weight: 1.0
geometry_weight: 0.1
seed: 0
device: auto
