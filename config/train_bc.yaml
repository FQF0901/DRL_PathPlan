# BC / DAgger training defaults.  CLI flags override every value below.
data:
  - data/episodes/train_2000/il_expert
val_data:
  - data/episodes/val_500/expert_reference
# val_data is the fixed 500-scene held-out set; val_frac is ignored when set.
out: runs/bc_2k
epochs: 30
batch_size: 1024
lr: 0.001
weight_decay: 0.0001
max_grad_norm: 1.0
val_frac: 0.1
seed: 0
device: auto
init: null

# Plan loss weights.
nll_coef: 1.0
w_point: 1.0
w_heading: 1.0
w_velocity: 0.2
w_curvature: 0.1
w_accel: 0.1
dt: 0.5

# Per-row plan weights / failure policy.
w_privileged: 1.0
w_residual: 0.2
w_shield: 3.0
w_student_failure: 2.0
w_failed_expert: 0.2
w_infeasible: 0.2
brake_weight: 0.0
near_weight: 0.0
source_weight_expert: 1.0
source_weight_other: 1.0
source_weight_replay: 1.0
source_weight_lift: 0.5
residual_xy_thresh: 0.5
residual_dpsi_thresh: 0.1
