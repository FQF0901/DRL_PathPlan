# 评估配置：独立进程、确定性、周期性执行
eval:
  spec: env/specs/scenarios_eval500.json  # 统一评测集（500 条完整 episode；train=5k 完整 episode，仅此两个子集）
  every_epochs: 5                     # 每 5 个 epoch 评估一次（epoch = train.steps_per_epoch）
  deterministic: true                 # 确定性评估（固定种子）
  process: separate                   # 独立进程运行
  recycle_every_specs: 150            # Gate 3：按 spec 实例数回收 worker（build_env-per-spec 泄漏
                                      # ~3.5MB/spec；reset 计数对这条路径无效）
  mem_available_floor_mb: 3000        # Gate 3：评测前查 MemAvailable，低于此值先暂停/缩减训练池
  train_pool_policy: pause            # Gate 3：评测期间训练池必须暂停（或 worker<=2），避免 OOM 场景复现

kpis:                                 # 评估 KPI（按 primary 标签分组；复合模板单列 compound）
  - collision
  - offroad
  - min_ttc
  - a_lon
  - a_lat
  - jerk
  - speed_ratio
  - solid_line_crossing
  - speed_limit_violation
  - route_completion
  - per_category_success              # 分组口径 = spec.labels.geometry（primary）
  - overall_success                   # Gate 3 新增：总体成功率条款（原协议只有分项）

counterfactual:                       # R41-A1：oracle/teacher-force/speed 反事实（CLI 开关同名；
                                      # 默认全关 ⇒ 零触达、前向/协议 hash/缓存键逐位不变）。
                                      # 非默认档：入 evaluation protocol hash + 模型缓存键（五轴同段）+
                                      # metrics/manifest；truth/裁决见 oracle_audit + oracle_hook/*.jsonl
  teacher_force: "off"                # off|ego|od|ld|ego_od_ld|lateral|all（需 --world-state-api 非 off）
  record_truth: null                  # 目录：记录 pass 真值（与 inject 互斥；只观察）
  inject_truth: null                  # 目录：注入 pass 真值源（目录内容 sha16 入 hash）
  speed_scale: 1.0                    # plan 后处理同缩（>0；1.0=关）；speed_oracle: off|expert
  speed_oracle: "off"
  drift_thresholds:                   # 两遍重放五类漂移门（预注册默认；超标 episode 剔除出裁决）
    pose_p95_m: 0.5                   # ① replay pose divergence：决策帧位置误差 p95（m）
    pose_max_m: 2.0                   # ① 决策帧位置误差 max（m）
    heading_p95_rad: 0.15             # ① 航向误差 p95（rad，wrap 后）
    od_mean_abs: 0.25                 # ② OD state divergence：掩码内均绝对差
    od_max_abs: 2.0                   # ② 掩码内最大绝对差
    rng_match_frac_min: 0.98          # ③ traffic RNG 一致性：决策帧 RNG 摘要一致率下限
    stepwise_pos_p95_m: 0.5           # ⑤ 逐步状态误差：逐 env step 位置误差 p95（m）
    stepwise_speed_mean_abs: 0.5      # ⑤ 逐 env step 速度误差均值（m/s）
    termination_step_tol: 2           # ④ termination 一致性：步数容差（解）
    illegal_frac_max: 0.05            # 动作条件非法注入步占比上限（超出 ⇒ 剔除）
    unproven_frac_max: 0.05           # 动作条件不可判定步占比上限（超出 ⇒ 剔除）
    action_tol_ds_m: 5.0e-3           # 命令面动作条件容差（ds，m；V4B 计划序列口径）
    action_tol_dtheta_rad: 5.0e-3     # 命令面动作条件容差（dθ，rad）
    realized_tol_ds_m: 5.0e-3         # 实测（位姿派生）动作条件容差（ds，m）
    realized_tol_dtheta_rad: 5.0e-3   # 实测动作条件容差（dθ，rad）
  frame_gate:                         # 决策帧"同状态门"（预检硬门；超标帧注入整帧自动拒绝）
    pose_pos_m: 0.5
    heading_rad: 0.15
    od_mean_abs: 0.5
    rng_required: 1

thresholds:                           # P0 冻结（Gate 2 + Gate 3 修订）：相对规则基线口径
  protocol: relative_to_rule_baseline
  baseline: pure_pursuit_idm
  baseline_frozen_at: "2026-09-25"    # runs/baseline_eval/val_reference.json；主标签分组见
                                      # runs/baseline_eval/val_reference_by_primary.json
  grouping: primary_label             # 按 spec.labels.geometry 分组；其余标签进 compound 单列
  overall_success: ">= max(baseline - 0.05, 0.70)"     # 总体条款（新）
  collision_rate: "<= max(baseline, 0.01)"             # 零基线保护 ε
  offroad_rate: "<= max(baseline, 0.01)"
  route_completion: ">= baseline - 0.05"
  speed_ratio: ">= baseline * 0.90"                    # 效率守卫：防爬行刷 rc/安全分
  a_lat_mean: "<= baseline * 1.10"
  a_lat_p95: "<= baseline * 1.20"                      # 尾部指标（mean 会掩盖急打方向）
  per_category_success: "weak(baseline<0.7) -> target=max(baseline+0.15, 0.75)；否则 >= baseline - 0.10"
  per_category_n_min: 30                               # n<30 仅报告 + Wilson CI，不判定

dataset_gate:                         # 数据侧 gate，与 policy KPI 分离（Gate 3 改口径）
  consistency_violations: 0           # 与物理时间相悖的违例数（数据集抽验）
  bc_retained_step_yield: ">= 0.60"   # 过滤后保留步数产出率（替代原 bc_expert_success_rate>=0.90，
                                      # 该口径与已接受的 IDMPolicy 冷启动质量矛盾）
  min_samples_per_scenario: 10        # policy-step (2Hz)
  min_samples_per_category: 50        # 每受监督标签的正样本下限
  # BC 过滤规则（本地契约 `.slim/deepwork/p2-contract.md` §8.2 已随 CLEAN-1 清理）：终末截断 /
  # 3s 窗口干净 / on_lane / round-trip 可复现 / 事件 fired∧actor_alive / 难度几何配平
