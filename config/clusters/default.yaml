# 场景原型聚类规格（lane C / fix-4；契约 docs/design-v1.2.md §4）
#
# `spec`：冻结的聚类 artifact（质心/PCA/白化/特征口径/数据指纹/git hash）。
# `cluster_version`：与 artifact 内 `cluster_version` 必须一致，加载时不匹配直接报错。
# temperature/boundary_margin/smooth_strength：assign_soft（软目标形状）参数，仅 annotate 的
#   argmax 硬标签与 survey 诊断使用；训练侧 router 只用硬标签 CE（无温度旋钮，lane B B3）。
#
# lane D（2026-09-27）：v2 契约 47 维（ego8 + od top6×4 + nav cmd3 + road_class12），
# 强制均衡 cap 15% / floor 8%（count shares），capacity_ok=True；v1 保留但不再使用。
# 重拟合命令见 config/clusters/README.md。
cluster_version: v2
spec: config/clusters/cluster_v2.npz

k: 8
pca_dim: 32
temperature: 0.5          # top-2 softmax 温度 τ（距离空间；0.5 → 典型 0.65/0.35）
boundary_margin: 0.05     # top-2 相对间隔低于该值 = 边界样本 → 向 top-3/均匀平滑
smooth_strength: 0.5      # 边界平滑强度上限
two_stage: false          # 历史两段式退路；lane D 变体（b）用 --balanced-split（仍是 flat spec）
