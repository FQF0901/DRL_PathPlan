# Raw DAgger collection defaults. CLI flags override every value.
# Run from the repository root with no arguments:
#   python dataset/collect_dagger.py
specs: data/specs/train_2000.json
# Round 2 focuses collection on the failure-heavy medium/hard scenes.
difficulties: [medium, hard]
out: data/episodes/train_2000/il_dagger_raw_r2
ckpt: runs/bc_dagger_raw_r1_261101173703/best_closed_loop.pt
limit: null
offset: 0
workers: 4
max_steps: 600
# More expert labels around failure states than round 1.
expert_ratio: 0.6
shield_ttc: 2.5
# Force expert takeover after 20 low-speed decision steps (~10 s).
stuck_shield_steps: 20
round: 2
seed: 0
device: auto
