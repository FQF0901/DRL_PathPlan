# Real-env group-relative PPO defaults (docs/arch_lock.md §12.4).
# CLI flags override every value below.  Reward weights are RewardConfig
# defaults; only a few optional weights are exposed on the CLI.
specs: data/specs/train_2000.json
holdout_specs: data/specs/val_500.json
easy_weight: 1.0
medium_weight: 1.5
hard_weight: 2.0
ckpt: runs/bc_dagger_exact_r3_261107031440/best_closed_loop.pt
out: runs/rl_group_r5

updates: 50
scenes_per_update: 8
group_size: 8
max_steps: 600
max_decisions: 120

gamma: 0.99
clip: 0.2
epochs: 4
minibatch: 256
lr: 0.00003
tsb_lr: 0.000003
workers: 4
device: cuda
seed: 0

eval_every: 5
eval_limit: 500
eval_max_steps: 600

max_grad_norm: 0.5
kl_stop: 0.02
clip_frac_stop: 0.3
adv_std_floor: 0.000001
logprob_audit_size: 32

# Policy exploration: effective std = std_min + (1-std_min)*exp(logstd)
# BC logstd is a likelihood parameter, not an RL exploration policy; the floor
# prevents PPO from collapsing the behavior policy to deterministic.
# Action dims are (dx, dy, dpsi, v_next) in metres / radians / m/s.  Independent
# i.i.d. noise on dx and v_next breaks the 0.5 s time law (dx ~ v*dt) and can
# produce invalid_action; 0.05 was measured to be degenerate (0% success, 34%
# invalid on the u1 batch). 0.01/0.001 is the largest safe i.i.d. floor found.
#
# r5 schedule (only exploration changes vs r4b):
#   updates 1..hold  -> std_min_start
#   updates hold+1.. -> linear anneal to std_min_end
#   after anneal     -> std_min_end
# std_min stays as the constant fallback when start/end are absent.
std_min: [0.005, 0.0, 0.0, 0.005]
std_min_start: [0.01, 0.001, 0.001, 0.01]
std_min_end: [0.005, 0.0, 0.0, 0.005]
std_min_hold_updates: 10
std_min_anneal_updates: 10
entropy_coef: 0.01
